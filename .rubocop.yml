# The golden harness's rubocop config, self-contained.
#
# `rubocop -A` is the pipeline's last pass and the SAME pass runs over
# discovery.cpp.rb, so both sides come out laid out identically and the diff
# shows substance only.

plugins:
  - rubocop-nathank
  - rubocop-disable_syntax

require:
  - ./cops/multiline_struct_new.rb
  - ./cops/multiline_condition.rb
  - ./cops/blank_line_between_statements.rb
  - ./cops/single_line_arguments.rb
  - ./cops/single_line_block.rb
  - ./cops/multiline_string.rb
  - ./cops/macro_parentheses.rb
  - ./cops/block_delimiters.rb
  - ./cops/no_blank_line_before_branch.rb
  - ./cops/disable_syntax_ternary_autocorrect.rb
  - ./cops/constants_first.rb
  - ./cops/no_conditional_assignment_parens.rb

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - 'refs/**/*'
    - 'data/**/*'
    - 'bin/**/*'

Layout/AccessModifierIndentation:
  Enabled: true
  EnforcedStyle: indent

Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: indented_internal_methods

Layout/IndentationWidth:
  Enabled: true
  Width: 2

Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - constants
    - public_attribute_macros
    - public_delegate
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
    public_attribute_macros:
      - attr_reader
      - attr_writer
      - attr_accessor
    macros:
      - type_register
      - install_property
      - gtk_accessor
      - signal_connect
      - set_accels_for_action
      - add_action
      - bind_property
      - add_setter
    public_delegate:
      - delegate
    protected_attribute_macros:
      - attr_reader
      - attr_writer
      - attr_accessor
    private_attribute_macros:
      - attr_reader
      - attr_writer
      - attr_accessor
    private_delegate:
      - delegate

# OFF for this harness.
#
# The comment cops judge comments someone wrote -- unwrapped paragraphs, a
# summary no longer than the code earns, annotations on a documented
# interface. Every comment in the output is the C++ author's, carried across
# verbatim by transform.yml's r-comment, so there is nothing here for the cop
# to be right about and an autocorrect would rewrite the source's words.
Nathank/CommentStructure:
  Enabled: false

# OFF for this harness.
#
# The cop bans `return` on the grounds that a method's last expression is its
# return value and guards are structural. That is a judgement about code
# someone wrote; this is a transliteration, where a C++ `return x;` is a fact
# about the source and an early return in the middle of a method has no
# last-expression equivalent. discovery.cpp returns early 40-odd times.
#
# Autocorrecting them away would change which statements run.
Nathank/NoReturn:
  Enabled: false

# Bans the ternary. The pipeline must therefore not EMIT one: this cop only
# reports, it does not autocorrect, so the expansion into if/else lives in
# scripts/rules/03_03_simplify.yml (s-ternary-decl, s-ternary-assign, s-ternary-arg).
Style/DisableSyntax:
  DisableSyntax:
    - ternary

Layout/LineLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
Layout/EmptyLineAfterMagicComment:
  Enabled: false

Layout/EmptyLines:
  Enabled: true
Layout/TrailingEmptyLines:
  Enabled: true
Layout/EmptyLinesAroundMethodBody:
  Enabled: true
Layout/EmptyLinesAroundClassBody:
  Enabled: true
Layout/EmptyLinesAroundModuleBody:
  Enabled: true
Layout/EmptyLinesAroundBlockBody:
  Enabled: true
Layout/EmptyLineBetweenDefs:
  Enabled: true
Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation
Layout/ParameterAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation
Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent
Layout/ClosingParenthesisIndentation:
  Enabled: true
Layout/MultilineMethodCallBraceLayout:
  Enabled: true
Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented
Layout/MultilineOperationIndentation:
  Enabled: true
  EnforcedStyle: indented
Layout/ElseAlignment:
  Enabled: true
Layout/EndAlignment:
  Enabled: true
  EnforcedStyleAlignWith: variable
Layout/BlockAlignment:
  Enabled: true
Layout/BlockEndNewline:
  Enabled: true
Layout/DefEndAlignment:
  Enabled: true
Layout/CaseIndentation:
  Enabled: true
Layout/CommentIndentation:
  Enabled: true
Layout/ExtraSpacing:
  Enabled: true
Layout/LeadingEmptyLines:
  Enabled: true
Layout/SpaceAroundOperators:
  Enabled: true
Layout/SpaceInsideParens:
  Enabled: true
Layout/SpaceAfterComma:
  Enabled: true
Layout/TrailingWhitespace:
  Enabled: true
Layout/EmptyLinesAroundAccessModifier:
  Enabled: true
Layout/LineEndStringConcatenationIndentation:
  Enabled: true
Layout/EmptyLineAfterMultilineCondition:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: true
Layout/EmptyLinesAroundArguments:
  Enabled: true
Layout/EmptyLinesAroundBeginBody:
  Enabled: true
Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: true
Layout/EmptyLinesAfterModuleInclusion:
  Enabled: true
Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true
Layout/EmptyComment:
  Enabled: true
Layout/MultilineBlockLayout:
  Enabled: true

Style/IfInsideElse:
  Enabled: true

Transpile/MultilineStructNew:
  Enabled: true
  Description: Lay out Struct.new with one member per line, as the golden does.

Transpile/MultilineCondition:
  Enabled: true
  Description: >-
    Wrap a long boolean condition in parentheses, one operand per line. The
    built-in Layout cops re-indent existing breaks but never introduce them, so
    a long transliterated condition would otherwise stay on one line.

Transpile/BlankLineBetweenStatements:
  Enabled: true
  Description: >-
    Separate a multi-line statement from the next with a blank line. Confirmed
    against `rubocop --show-cops` that no built-in covers this: the
    EmptyLinesAround*Body family handles the inside of a body,
    EmptyLineAfterMultilineCondition the condition/body gap, and
    EmptyLineAfterGuardClause only guard clauses.

Transpile/SingleLineArguments:
  Enabled: true
  Description: >-
    Join a wrapped argument list onto one line. The break is an artefact of the
    C++ source. No built-in does this: Layout/LineLength is the only cop that
    moves code between lines and it only splits, and it is disabled here
    because it would wrap transliterated expressions arbitrarily.

Transpile/SingleLineBlock:
  Enabled: true
  Description: >-
    Join a value-producing block onto one line. Unparser lays every block out
    across lines; the golden keeps a log-message block inline.

Transpile/MacroParentheses:
  Enabled: true
  Description: >-
    Drop the parentheses from an include/extend/require call. Unparser
    parenthesises every call with an argument; these read as declarations, and
    ClassStructure treats module_inclusion as its own category.

Transpile/MultilineString:
  Enabled: true
  Description: >-
    Put each adjacent string literal on its own line, joined by a backslash.
    The grouping is the C++ author's line breaks inside a `<<` chain; unparser
    writes them on one line.

Transpile/BlockDelimiters:
  Enabled: true
  Description: >-
    Use `do ... end` for a multi-line block, braces for one inside a condition.
    Style/BlockDelimiters cannot do it: its line_count_based style rewrites the
    condition case too, and the golden keeps braces there.

Transpile/NoBlankLineBeforeBranch:
  Enabled: true
  Description: >-
    Remove a blank line left at the end of a body, immediately before the
    `else`, `elsif` or `end` that closes it. The EmptyLinesAround* family each
    handle one specific kind of body and none of them reaches the branches of
    an `if` or a `case`.


Transpile/ConstantsFirst:
  Enabled: true
  Description: >-
    Move a constant assignment above the first method in its class.
    Layout/ClassStructure states the order and reports the violation but does
    not correct this one, so the offence had nothing able to fix it.

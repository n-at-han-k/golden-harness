  - id: l-arg-addr-10
    rule:
      kind: pointer_expression
      regex: '^&'
      inside:
        kind: argument_list
        has:
          kind: lambda_expression
          nthChild: { position: 1, reverse: true }
      has: { field: argument, pattern: $LAA }
    fix: "$LAA"

id: cpp-to-ruby
language: cpp
severity: hint
rule:
  kind: translation_unit
  pattern: $TU

rewriters:
  - id: s-struct-field-1
    rule:
      kind: field_declaration
      inside: { kind: field_declaration_list }
      all:
        - has: { field: declarator, kind: field_identifier, pattern: $SFN }
        - not: { has: { field: declarator, kind: function_declarator } }
    fix: ":$SFN"
  - id: s-struct-1
    rule:
      any:
        - kind: struct_specifier
        - kind: class_specifier
      inside: { kind: compound_statement, stopBy: end }
      all:
        - has: { field: name, kind: type_identifier, pattern: $STN }
        - has: { field: body, kind: field_declaration_list, pattern: $STB }
        - not: { has: { stopBy: end, kind: function_declarator } }
    transform:
      SFIELDS:
        rewrite:
          rewriters: [s-struct-field-1]
          source: $STB
          joinBy: ",\n"
    fix: |-
      $STN = Struct.new(
      $SFIELDS,
      keyword_init: true
      )
  - id: s-struct-drop-1
    rule:
      any:
        - kind: struct_specifier
        - kind: class_specifier
      inside: { kind: compound_statement, stopBy: end }
      all:
        - has: { field: name, kind: type_identifier }
        - has: { field: body, kind: field_declaration_list }
        - not: { has: { stopBy: end, kind: function_declarator } }
    fix: ""
  - id: s-map-decl-1
    rule:
      kind: declaration
      inside: { kind: compound_statement }
      all:
        - has:
            field: type
            stopBy: end
            kind: template_type
            all:
              - has:
                  field: name
                  kind: type_identifier
                  regex: '^(map|unordered_map|QMap|QHash)$'
              - has:
                  field: arguments
                  kind: template_argument_list
                  has:
                    kind: type_descriptor
                    nthChild: 2
                    has: { field: type, kind: type_identifier, pattern: $VT }
        - has: { field: declarator, stopBy: end, kind: identifier, pattern: $MN }
    fix: |-
      $MN = Hash.new do |hash, key|
      hash[key] = $VT.new
      end
  - id: l-lcall-1
    rule:
      kind: call_expression
      all:
        - has: { field: function, kind: identifier, pattern: $LNAME }
        - has: { field: arguments, kind: argument_list, pattern: $LCARGS }
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              kind: init_declarator
              all:
                - has: { field: declarator, kind: identifier, pattern: $LNAME }
                - has: { field: value, kind: lambda_expression }
    transform:
      LCARGSR:
        rewrite: { rewriters: [l-iife-2, l-new-2, l-new0-2, l-brace-init-2, l-addr-2, l-lcall-2, l-lbare-2, l-enum-2, l-enum-value-2], source: $LCARGS }
    fix: "$LNAME.call$LCARGSR"
  - id: l-lbare-1
    rule:
      kind: identifier
      pattern: $LBNAME
      all:
        - inside: { kind: expression_statement }
        - not: { inside: { kind: init_declarator } }
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              kind: init_declarator
              all:
                - has: { field: declarator, kind: identifier, pattern: $LBNAME }
                - has: { field: value, kind: lambda_expression }
    fix: "$LBNAME.call"
  - id: l-enum-value-1
    rule:
      kind: identifier
      pattern: $EV
      regex: '^[A-Z][a-z][A-Za-z0-9]*$'
      not:
        inside:
          kind: translation_unit
          stopBy: end
          has:
            stopBy: end
            any:
              - kind: qualified_identifier
                has: { field: scope, pattern: $EV }
              - kind: call_expression
                has: { field: function, kind: identifier, pattern: $EV }
              - kind: field_expression
                has: { field: argument, kind: identifier, pattern: $EV }
    transform:
      EVSYM:
        convert: { source: $EV, toCase: snakeCase }
    fix: ":$EVSYM"
  - id: l-enum-1
    rule:
      kind: qualified_identifier
      has:
        field: name
        stopBy: end
        kind: identifier
        pattern: $ENAME
        regex: '^[A-Z][A-Za-z0-9]*$'
    transform:
      ESYM:
        convert: { source: $ENAME, toCase: snakeCase }
    fix: ":$ESYM"
  - id: l-addr-1
    rule:
      kind: pointer_expression
      regex: '^&'
      inside: { kind: argument_list }
      has: { field: argument, pattern: $AV }
    fix: "$AV"
  - id: l-new-1
    rule:
      kind: new_expression
      all:
        - has: { field: type, pattern: $NT }
        - has: { field: arguments, kind: argument_list, pattern: $NA }
    transform:
      NAR:
        rewrite: { rewriters: [l-iife-2, l-new-2, l-new0-2, l-brace-init-2, l-addr-2, l-lcall-2, l-lbare-2, l-enum-2, l-enum-value-2], source: $NA }
    fix: "$NT.new$NAR"
  - id: l-new0-1
    rule:
      kind: new_expression
      has: { field: type, pattern: $NT0 }
      not: { has: { field: arguments, kind: argument_list } }
    fix: "$NT0.new"
  - id: l-brace-init-1
    rule:
      kind: compound_literal_expression
      all:
        - has: { field: type, pattern: $BT }
        - has: { field: value, kind: initializer_list, pattern: $BV }
    transform:
      BARGS:
        replace: { source: $BV, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: "$BT.new($BARGS)"
  - id: l-iife-1
    rule:
      kind: call_expression
      has:
        field: function
        kind: lambda_expression
        has:
          field: body
          kind: compound_statement
          all:
            - has:
                kind: return_statement
                has: { stopBy: end, pattern: $IIFE }
            - not: { has: { nthChild: 2 } }
    fix: "$IIFE"
  - id: s-assert-1
    rule:
      kind: expression_statement
      inside: { kind: compound_statement }
      has:
        stopBy: end
        kind: call_expression
        all:
          - has:
              field: function
              kind: identifier
              regex: '^(OC_ASSERT|OC_ASSERT_X|OC_ENFORCE|OC_ENFORCE_X|Q_ASSERT|Q_ASSERT_X)$'
          - has:
              field: arguments
              kind: argument_list
              has: { pattern: $ACOND }
    fix: |-
      unless $ACOND
      raise
      end
  - id: s-unreachable-1
    rule:
      kind: expression_statement
      inside: { kind: compound_statement }
      has:
        stopBy: end
        kind: call_expression
        has:
          field: function
          kind: identifier
          regex: '^(Q_UNREACHABLE|OC_UNREACHABLE)$'
    fix: "raise"
  - id: s-decl-1
    rule:
      kind: declaration
      inside: { kind: compound_statement }
      has:
        field: declarator
        kind: init_declarator
        all:
          - has: { field: declarator, pattern: $DN }
          - has: { field: value, pattern: $DVR }
    transform:
      DV_NL:
        rewrite: { rewriters: [l-iife-1, l-call-1, l-call0-1, l-lambda-arg-1, l-lambda0-arg-1, l-lambda-1, l-lambda0-1, l-call-brace-1, l-new-1, l-new0-1, l-brace-init-1, l-addr-1, l-lcall-1, l-lbare-1, l-enum-1, l-enum-value-1], source: $DVR }
      DV_DOT:
        replace: { source: $DV_NL, replace: '\s*\n\s*\.', by: '.' }
      DV:
        replace: { source: $DV_DOT, replace: '\s*\n\s*(?<OP>&&|\|\|)', by: ' $OP' }
    fix: "$DN = $DV"
  - id: s-decl-bare-1
    rule:
      kind: declaration
      inside: { kind: compound_statement }
      all:
        - has: { field: declarator, kind: identifier, pattern: $DNB }
        - not: { has: { field: declarator, kind: init_declarator } }
    fix: "$DNB = nil"
  - id: s-log-1
    rule:
      kind: expression_statement
      inside: { kind: compound_statement }
      has:
        kind: binary_expression
        pattern: $CHAIN
        has:
          stopBy: end
          kind: call_expression
          all:
            - has:
                field: function
                stopBy: end
                kind: identifier
                pattern: $LFNAME
                regex: '^qC(Info|Debug|Warning|Critical|Fatal)$'
            - has:
                field: arguments
                kind: argument_list
                has: { kind: identifier, pattern: $LCAT }
    transform:
      LRAW:
        rewrite:
          rewriters: [g-head, g-lit, g-val-paren, g-val]
          source: $CHAIN
      LP1:
        replace: { source: $LRAW, replace: '^\s*<<\s*', by: '' }
      LP2:
        replace: { source: $LP1, replace: '\s*\n\s*<<\s*', by: "\" \\\n\"" }
      LJOIN:
        replace: { source: $LP2, replace: '\s*<<\s*', by: ' ' }
      # Markers out.
      LPARTS:
        replace: { source: $LJOIN, replace: '@~@', by: '' }
      LL1:
        replace: { source: $LFNAME, replace: '^qCWarning$', by: 'warn' }
      LL2:
        replace: { source: $LL1, replace: '^qCCritical$', by: 'error' }
      LL3:
        replace: { source: $LL2, replace: '^qC', by: '' }
      LLVL:
        convert: { source: $LL3, toCase: lowerCase }
    fix: 'Log.$LLVL($LCAT) { "$LPARTS" }'
  - id: s-expr-1
    rule:
      kind: expression_statement
      inside: { kind: compound_statement }
      has: { pattern: $EXR }
    transform:
      EX_NL:
        rewrite: { rewriters: [l-iife-1, l-call-1, l-call0-1, l-lambda-arg-1, l-lambda0-arg-1, l-lambda-1, l-lambda0-1, l-call-brace-1, l-new-1, l-new0-1, l-brace-init-1, l-addr-1, l-lcall-1, l-lbare-1, l-enum-1, l-enum-value-1], source: $EXR }
      EX_DOT:
        replace: { source: $EX_NL, replace: '\s*\n\s*\.', by: '.' }
      EX:
        replace: { source: $EX_DOT, replace: '\s*\n\s*(?<OP>&&|\|\|)', by: ' $OP' }
    fix: "$EX"
  - id: s-return-1
    rule:
      kind: return_statement
      inside: { kind: compound_statement }
      has: { stopBy: end, pattern: $RVR }
    transform:
      RV_NL:
        rewrite: { rewriters: [l-iife-1, l-call-1, l-call0-1, l-lambda-arg-1, l-lambda0-arg-1, l-lambda-1, l-lambda0-1, l-call-brace-1, l-new-1, l-new0-1, l-brace-init-1, l-addr-1, l-lcall-1, l-lbare-1, l-enum-1, l-enum-value-1], source: $RVR }
      RV_DOT:
        replace: { source: $RV_NL, replace: '\s*\n\s*\.', by: '.' }
      RV:
        replace: { source: $RV_DOT, replace: '\s*\n\s*(?<OP>&&|\|\|)', by: ' $OP' }
    fix: "return $RV"
  - id: s-return-void-1
    rule:
      kind: return_statement
      inside: { kind: compound_statement }
      not: { has: { stopBy: end, pattern: $ANYR } }
    fix: "return"
  - id: s-next-1
    rule: { kind: continue_statement, inside: { kind: compound_statement } }
    fix: "next"
  - id: s-break-1
    rule: { kind: break_statement, inside: { kind: compound_statement } }
    fix: "break"
  # A comment inside a body. Converted HERE rather than in a separate pass,
  # because `#` at line start is a preprocessor directive to a C++ parser.
  - id: s-comment-1
    rule:
      kind: comment
      inside: { kind: compound_statement }
      pattern: $SC
    transform:
      SCB:
        replace: { source: $SC, replace: '(?m)^[ \t]*(?:/\*+|//+|\*+/|\*)[ \t]?', by: '# ' }
    fix: "$SCB"
  # An immediately-invoked lambda BOUND TO A NAME:
  #
  #     const bool serverModified = [&] { ...; return x; }();
  #
  # becomes
  #
  #     server_modified = lambda do
  #       ...
  #     end
  #     server_modified.call
  #
  # Two statements rather than `end.call`, so `end` ends its own line. That
  # matters beyond looks: rubyify.py finds a method's extent by scanning for a
  # matching `end`, and `end.call` is not that token, so the scan ran past the
  # method and swallowed every following `# @class` tag into one block.
  #
  # Only a MULTI-statement body reaches here -- l-iife has already reduced a
  # lone `return expr;` to the expression itself -- which is checked with
  # `has: { nthChild: 2 }`.
  # The same, for an IIFE that takes PARAMETERS and is called with arguments:
  #
  #     const auto unsupportedCharacter = [](const QString &fName) {
  #         ...
  #     }(item->localName());
  #
  # Without this the lambda became a block but the call's argument list was
  # left dangling as `end(item.local_name)`. Listed before the no-argument
  # form so it claims the node first.
  - id: s-iife-decl-args-1
    rule:
      kind: declaration
      inside: { kind: compound_statement }
      has:
        field: declarator
        kind: init_declarator
        all:
          - has: { field: declarator, stopBy: end, kind: identifier, pattern: $IAN }
          - has:
              field: value
              kind: call_expression
              all:
                - has: { field: arguments, kind: argument_list, pattern: $IAARGS }
                - has:
                    field: function
                    kind: lambda_expression
                    all:
                      - has:
                          field: declarator
                          kind: abstract_function_declarator
                          has:
                            field: parameters
                            kind: parameter_list
                            pattern: $IAP
                            has: { kind: parameter_declaration }
                      - has:
                          field: body
                          kind: compound_statement
                          pattern: $IAB
                          has: { nthChild: 2 }
    transform:
      IAPARAMS:
        rewrite:
          rewriters: [p-named, p-unnamed, p-variadic]
          source: $IAP
          joinBy: ", "
      IARAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $IAB }
      IABODY:
        replace: { source: $IARAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      $IAN = lambda do |$IAPARAMS|
      $IABODY
      end
      $IAN.call$IAARGS
  - id: s-iife-decl-1
    rule:
      kind: declaration
      inside: { kind: compound_statement }
      has:
        field: declarator
        kind: init_declarator
        all:
          - has: { field: declarator, stopBy: end, kind: identifier, pattern: $IDN }
          - has:
              field: value
              kind: call_expression
              has:
                field: function
                kind: lambda_expression
                has:
                  field: body
                  kind: compound_statement
                  pattern: $IDB
                  has: { nthChild: 2 }
    transform:
      IDRAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $IDB }
      IDBODY:
        replace: { source: $IDRAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      $IDN = lambda do
      $IDBODY
      end
      $IDN.call
  - id: l-arg-1
    rule:
      pattern: $LA
      not: { kind: lambda_expression }
      inside:
        kind: argument_list
        has:
          kind: lambda_expression
          nthChild: { position: 1, reverse: true }
    fix: "$LA"
  - id: l-arg-addr-1
    rule:
      kind: pointer_expression
      regex: '^&'
      inside:
        kind: argument_list
        has:
          kind: lambda_expression
          nthChild: { position: 1, reverse: true }
      has: { field: argument, pattern: $LAA }
    fix: "$LAA"
  - id: l-lambda-arg-1
    rule:
      kind: lambda_expression
      inside: { kind: argument_list }
      all:
        - has:
            field: declarator
            kind: abstract_function_declarator
            has:
              field: parameters
              kind: parameter_list
              pattern: $LAP
              has: { kind: parameter_declaration }
        - has: { field: body, kind: compound_statement, pattern: $LAB }
    transform:
      LAARGS:
        rewrite:
          rewriters: [p-named, p-unnamed, p-variadic]
          source: $LAP
          joinBy: ", "
      LARAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $LAB }
      LABODY:
        replace: { source: $LARAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      lambda { |$LAARGS|
      $LABODY
      }
  - id: l-lambda0-arg-1
    rule:
      kind: lambda_expression
      inside: { kind: argument_list }
      has: { field: body, kind: compound_statement, pattern: $LZAB }
      not:
        has:
          field: declarator
          stopBy: end
          kind: parameter_declaration
    transform:
      LZARAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $LZAB }
      LZABODY:
        replace: { source: $LZARAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      lambda {
      $LZABODY
      }
  - id: l-lambda-1
    rule:
      kind: lambda_expression
      all:
        - has:
            field: declarator
            kind: abstract_function_declarator
            has:
              field: parameters
              kind: parameter_list
              pattern: $LMP
              has: { kind: parameter_declaration }
        - has: { field: body, kind: compound_statement, pattern: $LMB }
    transform:
      LMARGS:
        rewrite:
          rewriters: [p-named, p-unnamed, p-variadic]
          source: $LMP
          joinBy: ", "
      LMRAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $LMB }
      LMBODY:
        replace: { source: $LMRAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      lambda do |$LMARGS|
      $LMBODY
      end
  - id: l-lambda0-1
    rule:
      kind: lambda_expression
      has: { field: body, kind: compound_statement, pattern: $LZB }
      not:
        has:
          field: declarator
          stopBy: end
          kind: parameter_declaration
    transform:
      LZRAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $LZB }
      LZBODY:
        replace: { source: $LZRAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      lambda do
      $LZBODY
      end
  - id: l-call-1
    rule:
      kind: call_expression
      not: { inside: { kind: condition_clause, stopBy: end } }
      all:
        - has: { field: function, pattern: $LFN }
        - has:
            field: arguments
            kind: argument_list
            pattern: $LAL
            has:
              kind: lambda_expression
              # The LAST argument. A block binds to the call it follows, so a
              # lambda anywhere else in the list cannot become one -- and
              # passing a lambda as the final argument instead of writing a
              # block is not how Ruby is written.
              nthChild: { position: 1, reverse: true }
              all:
                - has:
                    field: declarator
                    stopBy: end
                    kind: identifier
                    pattern: $LP
                - has: { field: body, kind: compound_statement, pattern: $LB }
    transform:
      LARGS:
        rewrite:
          rewriters: [l-arg-addr-1, l-arg-1]
          source: $LAL
          joinBy: ", "
      LBRAW:
        rewrite: { rewriters: [s-iife-decl-args-2, s-iife-decl-2, s-struct-2, s-map-decl-2, s-assert-2, s-unreachable-2, s-decl-2, s-decl-bare-2, s-log-2, s-expr-2, s-return-2, s-return-void-2, s-next-2, s-break-2, s-if-else-2, s-if-2, s-while-2, s-foreach-2, s-for-2, s-switch-2, s-case-pair-2, s-case-absorbed-2, s-case-2, s-default-2, s-block-2, s-comment-2], source: $LB }
      LBODY:
        replace: { source: $LBRAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      $LFN($LARGS) do |$LP|
      $LBODY
      end
  # The same, for a trailing lambda that declares no parameters. A Qt
  # `connect` slot is the common case: the signal supplies the arguments, and
  # the lambda itself takes none.
  - id: l-call0-1
    rule:
      kind: call_expression
      # Not inside a condition. `do ... end` binds to the OUTERMOST call, so a
      # block written that way in an `if` condition closes the `if` itself and
      # every statement after it falls outside the branch. l-call-brace handles
      # that position with `{ ... }`, which binds to the call it follows, and
      # is listed after these two so it picks up what they decline.
      not: { inside: { kind: condition_clause, stopBy: end } }
      all:

            kind: abstract_function_declarator
            has:
              field: parameters
              kind: parameter_list
              pattern: $LAP
              has: { kind: parameter_declaration }
        - has: { field: body, kind: compound_statement, pattern: $LAB }
    transform:
      LAARGS:
        rewrite:
          rewriters: [p-named, p-unnamed, p-variadic]
          source: $LAP
          joinBy: ", "
      LARAW:
        rewrite: { rewriters: [s-iife-decl-args-11, s-iife-decl-11, s-struct-11, s-map-decl-11, s-assert-11, s-unreachable-11, s-decl-11, s-decl-bare-11, s-log-11, s-expr-11, s-return-11, s-return-void-11, s-next-11, s-break-11, s-if-else-11, s-if-11, s-while-11, s-foreach-11, s-for-11, s-switch-11, s-case-pair-11, s-case-absorbed-11, s-case-11, s-default-11, s-block-11, s-comment-11], source: $LAB }
      LABODY:
        replace: { source: $LARAW, replace: '^\s*\{\s*|\s*\}\s*$', by: '' }
    fix: |-
      lambda { |$LAARGS|
      $LABODY
      }
  - id: l-lambda0-arg-10
    rule:

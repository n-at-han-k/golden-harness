id: a-alias-write-through
language: cpp
severity: hint
rule:
  kind: expression_statement
  has:
    kind: assignment_expression
    all:
      - has: { field: left, kind: identifier, pattern: $NAME }
      - has: { field: right, pattern: $RHS }
  follows:
    kind: declaration
    all:
      - has: { field: type, kind: placeholder_type_specifier }
      - not: { has: { kind: type_qualifier, regex: '^const$' } }
      - has:
          field: declarator
          kind: init_declarator
          all:
            - has:
                field: declarator
                kind: reference_declarator
                has: { kind: identifier, pattern: $NAME }
            - has: { field: value, pattern: $TARGET }
fix: "$TARGET = $RHS;"
---
id: a-alias-decl
language: cpp
severity: hint
rule:
  kind: declaration
  all:
    - has: { field: type, kind: placeholder_type_specifier }
    - not: { has: { kind: type_qualifier, regex: '^const$' } }
    - has:
        field: declarator
        kind: init_declarator
        has:
          field: declarator
          kind: reference_declarator
          has: { kind: identifier, pattern: $ANAME }
    - precedes:
        kind: expression_statement
        has:
          kind: assignment_expression
          has: { field: left, kind: identifier, pattern: $ANAME }
fix: ""
---

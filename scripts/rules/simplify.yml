# C++ -> C++ lowering, run before transform.yml.
#
# Self-contained to this directory. Each rule removes something that has no Ruby
# counterpart, while leaving the file parseable by tree-sitter -- it does NOT
# need to compile, which is what lets these compose.
#
# Ordering matters in one place: the conversion-operator rule must see the
# declarator before the indirection rule strips the reference off it.

# ---- types and qualifiers -------------------------------------------------
id: s-type-qualifier
language: cpp
severity: hint
rule:
  kind: type_qualifier
  regex: '^(const|volatile|mutable|constexpr|consteval|constinit)$'
fix: ""
---
id: s-explicit
language: cpp
severity: hint
rule: { kind: explicit_function_specifier }
fix: ""
---
id: s-virtual-specifier
language: cpp
severity: hint
rule: { kind: virtual_specifier }
fix: ""
---
id: s-noexcept
language: cpp
severity: hint
rule: { kind: noexcept }
fix: ""
---
id: s-trailing-return
language: cpp
severity: hint
rule: { kind: trailing_return_type }
fix: ""
---
# `= default;` and `= delete;` INCLUDE their trailing semicolon, and the parent
# function_definition carries no other terminator -- replacing them with nothing
# leaves a dangling `A()` and breaks the parse.
id: s-default-method
language: cpp
severity: hint
rule: { kind: default_method_clause }
fix: ";"
---
id: s-delete-method
language: cpp
severity: hint
rule: { kind: delete_method_clause }
fix: ";"
---
id: s-pure-virtual
language: cpp
severity: hint
rule: { kind: pure_virtual_clause }
fix: ";"
---
# ---- indirection ----------------------------------------------------------
# Every Ruby object is a reference and there is no way to say "pointer to", so
# T*, T& and T all collapse to the same thing.
id: s-pointer-declarator
language: cpp
severity: hint
rule:
  kind: pointer_declarator
  has: { field: declarator, pattern: $D }
fix: "$D"
---
id: s-reference-declarator
language: cpp
severity: hint
rule:
  kind: reference_declarator
  has: { pattern: $D }
fix: "$D"
---
# Lift any nested declarator first: `operator const path &() const` keeps its
# parameter list INSIDE the reference declarator, and a blank fix deleted the
# `()` with it.
id: s-abstract-pointer-nested
language: cpp
severity: hint
rule:
  kind: abstract_pointer_declarator
  has: { field: declarator, pattern: $D }
fix: "$D"
---
id: s-abstract-reference-nested
language: cpp
severity: hint
rule:
  kind: abstract_reference_declarator
  has: { pattern: $D }
fix: "$D"
---
id: s-abstract-pointer
language: cpp
severity: hint
rule:
  kind: abstract_pointer_declarator
  not: { has: { pattern: $ANY } }
fix: ""
---
id: s-abstract-reference
language: cpp
severity: hint
rule:
  kind: abstract_reference_declarator
  not: { has: { pattern: $ANY } }
fix: ""
---
# ---- templates ------------------------------------------------------------
# Ruby generics are implicit, so a template is just its inner declaration. The
# class case needs its `;` added back: a class_specifier does not include the
# trailing semicolon -- it is a SIBLING -- so lifting a class out of its
# template header silently drops it.
id: s-template-class
language: cpp
severity: hint
rule:
  kind: template_declaration
  has:
    any:
      - kind: class_specifier
      - kind: struct_specifier
      - kind: union_specifier
    pattern: $INNER
fix: "$INNER;"
---
id: s-template-function
language: cpp
severity: hint
rule:
  kind: template_declaration
  has: { kind: function_definition, pattern: $INNER }
fix: "$INNER"
---
id: s-template-other
language: cpp
severity: hint
rule:
  kind: template_declaration
  has:
    pattern: $INNER
    not: { kind: template_parameter_list }
fix: "$INNER"
---
# ---- things with no Ruby meaning -----------------------------------------
id: s-friend
language: cpp
severity: hint
rule: { kind: friend_declaration }
fix: ""
---
id: s-static-assert
language: cpp
severity: hint
rule: { kind: static_assert_declaration }
fix: ""
---
id: s-decltype
language: cpp
severity: hint
rule: { kind: decltype }
fix: "auto"
---
# `std::move(x)` is a C++ lifetime concern; Ruby has none.
id: s-std-move
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: qualified_identifier
        regex: '^std::(move|forward)$'
    - has: { field: arguments, kind: argument_list, pattern: $MA }
transform:
  INNER:
    replace: { source: $MA, replace: '^\(|\)$', by: '' }
fix: "$INNER"
---
# ---- literals -------------------------------------------------------------
# Qt string suffixes: _s (QString), _L1 (QLatin1String), _ba (QByteArray).
# All three convert a literal to a Qt string type whose Ruby counterpart is
# just String, so the suffix carries nothing. Char literals too -- `'/'_L1`.
id: s-string-literal-suffix
language: cpp
severity: hint
rule:
  kind: user_defined_literal
  all:
    - has:
        any:
          - kind: string_literal
          - kind: char_literal
          - kind: raw_string_literal
        pattern: $STR
    - has: { kind: literal_suffix, regex: '^_(s|L1|ba|qs)$' }
fix: "$STR"
---
# std::chrono durations normalise to seconds; Ruby has no duration type.
id: s-chrono-hours
language: cpp
severity: hint
rule:
  kind: user_defined_literal
  all:
    - has: { kind: number_literal, pattern: $N }
    - has: { kind: literal_suffix, regex: '^h$' }
fix: "($N * 3600)"
---
id: s-chrono-minutes
language: cpp
severity: hint
rule:
  kind: user_defined_literal
  all:
    - has: { kind: number_literal, pattern: $N }
    - has: { kind: literal_suffix, regex: '^min$' }
fix: "($N * 60)"
---
id: s-chrono-seconds
language: cpp
severity: hint
rule:
  kind: user_defined_literal
  all:
    - has: { kind: number_literal, pattern: $N }
    - has: { kind: literal_suffix, regex: '^(s|ms)$' }
fix: "$N"
---
# ---- ternary --------------------------------------------------------------
# Ruby's ternary is identical, but `cond ?a:b` is a syntax error there (`:b`
# lexes as a symbol), so spacing is normalised. The `not inside
# parenthesized_expression` guard is what makes this terminate: without it the
# fix re-matches its own output and each round adds another paren layer.
id: s-ternary
language: cpp
severity: hint
rule:
  kind: conditional_expression
  not:
    inside: { kind: parenthesized_expression }
  all:
    - has: { field: condition, pattern: $TC }
    - has: { field: consequence, pattern: $TT }
    - has: { field: alternative, pattern: $TE }
fix: "($TC ? $TT : $TE)"
---
# NOTE: the OC_ASSERT rule used to live here. Its fix is
# `unless cond / raise / end` -- which is RUBY, and this file is a
# C++ -> C++ stage, so emitting it here stopped transform.yml from parsing
# the file at all. (An earlier `fix: "raise"` survived only because `raise`
# happens to be a valid C++ identifier.) It is a rewriter in transform.yml
# now, which is where Ruby is emitted.
---
# `OC_ENSURE(cond)` is a checked predicate that RETURNS the condition, unlike
# OC_ASSERT which aborts, so it reduces to the condition itself.
id: s-oc-ensure
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(OC_ENSURE|OC_ENSURE_NOT)$'
    - has: { field: arguments, kind: argument_list, pattern: $EA }
transform:
  INNER:
    replace: { source: $EA, replace: '^\(|\)$', by: '' }
fix: "$INNER"
---
# NOTE: the struct -> Struct.new and std::map -> Hash.new idioms used to live
# here. They emit RUBY, which stops the file parsing as C++ and made
# transform.yml fall through to its CXX_UNMAPPED catch-all. They are rewriters
# in transform.yml now, where they belong.
---
# Qt literal wrappers: `QLatin1Char('.')`, `QStringLiteral("x")`,
# `QByteArrayLiteral("x")`, `QLatin1String("x")`. Each wraps a literal in a Qt
# type whose Ruby counterpart is just String, so the wrapper carries nothing.
#
# The char case must also change quoting: C++ writes a char as `'.'`, and Ruby
# has no char type -- the golden has `f.first[0] == "."`, double quoted.
id: s-qt-char-wrapper
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(QLatin1Char|QChar)$'
    - has:
        field: arguments
        kind: argument_list
        has:
          kind: char_literal
          has: { kind: character, pattern: $CH }
fix: '"$CH"'
---
id: s-qt-string-wrapper
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: identifier
        regex: '^(QStringLiteral|QByteArrayLiteral|QLatin1String|QLatin1StringView|QString::fromUtf8|tr)$'
    - has:
        field: arguments
        kind: argument_list
        has: { kind: string_literal, pattern: $QSTR }
fix: "$QSTR"
---
# Delete every comment except the licence header.
#
# The golden carries the file's licence block and nothing else -- zero comment
# lines below it. Deleting a comment leaves valid C++, which is why this is a
# simplify-stage rule: converting `//` to `#` would NOT be, because `#` at line
# start is a preprocessor directive and the file would stop parsing.
#
# A comment anywhere inside a body goes. The licence is the only comment at
# translation_unit scope that is a /* */ block, so file-scope line comments go
# too.
id: s-drop-body-comment
language: cpp
severity: hint
rule:
  kind: comment
  inside:
    stopBy: end
    any:
      - kind: compound_statement
      - kind: declaration_list
      - kind: field_declaration_list
      - kind: function_definition
      - kind: argument_list
      - kind: parameter_list
      - kind: initializer_list
fix: ""
---
id: s-drop-file-line-comment
language: cpp
severity: hint
rule:
  kind: comment
  inside: { kind: translation_unit }
  regex: '^//'
fix: ""
---
# `else if (c) { ... }` -> `else { if (c) { ... } }`
#
# An `else if` arrives as an if_statement sitting DIRECTLY under the
# else_clause rather than as a compound_statement, which is why the emitter's
# s-if-else rewriter -- `has: { field: alternative, kind: else_clause, has:
# { kind: compound_statement } }` -- misses it. 23 chains in discovery.cpp came
# out with their braces intact, and that alone made the whole file unparseable
# as Ruby.
#
# Normalising here, as pure C++ -> C++, means the emitter needs nothing new:
# s-if-else already handles a compound_statement alternative and s-block
# unwraps the braces. `rubocop -A` then collapses
#
#     else
#       if c
#         ...
#       end
#     end
#
# to `elsif c` via Style/IfInsideElse.
#
# The alternative was a chain-aware rewriter in transform.yml, which needs one
# rewriter TIER per link of the chain -- it pushed DEPTH from 7 to 14 and still
# ran out on this file.
#
# Terminates: the rewritten if is inside a compound_statement, so it no longer
# matches `inside: { kind: else_clause }`. A chain of N links needs N rounds of
# the simplify fixpoint, and the longest here is 4.
id: s-brace-else-if
language: cpp
severity: hint
rule:
  kind: if_statement
  pattern: $NESTED
  inside: { kind: else_clause }
fix: "{ $NESTED }"
---
# Drop the `break` that ends a switch case.
#
# Ruby's `when` does not fall through, so the C++ `break` has no counterpart --
# and `break` outside a loop is a hard Ruby syntax error, so leaving it in
# stops the file parsing. Only the LAST statement of the case is dropped, which
# `nthChild: { position: 1, reverse: true }` states exactly; a `break` anywhere
# else belongs to a loop inside the case and stays.
#
# Both parents are listed because the case body may or may not be braced at
# this point -- this rule runs before s-brace-case.
id: s-drop-case-break
language: cpp
severity: hint
rule:
  kind: break_statement
  nthChild: { position: 1, reverse: true }
  inside:
    any:
      - { kind: case_statement }
      - { kind: compound_statement, inside: { kind: case_statement } }
fix: ""
---
# `case X: a(); b();` -> `case X: { a(); b(); }`
#
# A case label's statements are DIRECT CHILDREN of the case_statement, with no
# compound_statement wrapping them. Bracing them here means the emitter can
# rebuild the node from its `value` and body fields and never has to find the
# end of the `case ...:` label in text -- an earlier version stripped the label
# with a greedy regex and ate the first statement when it contained a ternary
# (`case CSYNC_INSTRUCTION_NEW:` followed by `x = a ? b : c`).
#
# `context`/`selector` is what makes the statement list capturable: `$$$BODY`
# needs the label in front of it to parse, so the pattern is written as a whole
# switch and `selector` pulls out the case_statement.
id: s-brace-case
language: cpp
severity: hint
rule:
  pattern:
    context: "switch (_) { case $V: $$$BODY }"
    selector: case_statement
  not: { has: { kind: compound_statement } }
fix: "case $V: { $$$BODY }"
---
# The same for `default:`, which has no `value` field.
id: s-brace-default
language: cpp
severity: hint
rule:
  pattern:
    context: "switch (_) { default: $$$BODY }"
    selector: case_statement
  not: { has: { kind: compound_statement } }
fix: "default: { $$$BODY }"
---
# An empty fall-through label: `case A:` immediately followed by `case B:`,
# which in C++ means A shares B's body.
#
# The golden spells each as its own `when` with an empty body, so the label
# needs a body here for s-case to rebuild it. s-brace-case cannot do it --
# its `$$$BODY` pattern needs at least the label and body to align -- so the
# empty case is its own rule.
#
# `not: { has: { nthChild: 2 } }` is the test for "no statements": the `value`
# is the case_statement's first named child, so a second one can only be a
# statement.
id: s-brace-case-empty
language: cpp
severity: hint
rule:
  kind: case_statement
  has: { field: value, pattern: $V }
  not: { has: { nthChild: 2 } }
fix: "case $V: { }"
---
# `x++` -> `x += 1`, `x--` -> `x -= 1`.
#
# Both are valid C++, so this stays a C++ -> C++ normalisation and the file
# keeps parsing. Ruby has no `++`, and `x++` there parses as `x + +...`, which
# is a syntax error at end of line.
#
# Restricted to statement position. In value position (`*it++`, `a[i++]`) the
# C++ result is the value BEFORE the update, which `x += 1` does not reproduce,
# so those are deliberately left alone to be noticed rather than silently
# changed. discovery.cpp has none.
#
# The operator is an anonymous token, so `regex` on the node text is what
# separates increment from decrement.
id: s-increment
language: cpp
severity: hint
rule:
  kind: update_expression
  regex: '\+\+'
  inside: { kind: expression_statement }
  has: { field: argument, pattern: $UV }
fix: "$UV += 1"
---
id: s-decrement
language: cpp
severity: hint
rule:
  kind: update_expression
  regex: '\-\-'
  inside: { kind: expression_statement }
  has: { field: argument, pattern: $DV }
fix: "$DV -= 1"
---
# A braceless body gets braces: `if (done) return;` -> `if (done) { return; }`.
#
# Every statement rewriter in transform.yml requires a compound_statement body
# -- `has: { field: consequence, kind: compound_statement }` -- so a braceless
# branch matched nothing and came through as raw C++. `if (done)` then passed
# out as text while s-return rewrote the `return` under it, leaving a block
# with no `end`.
#
# One C++ -> C++ rule, against seven statement kinds times twelve tiers.
#
# The slot is pinned with `field`, which `inside` accepts as a relational
# option. That precision is the point: a `for_statement`'s INITIALISER is a
# `declaration`, so a rule that only said `inside: { kind: for_statement }`
# would brace `int i = 0` as well. An earlier version had to drop for_statement
# entirely for exactly that reason.
#
# else_clause needs no field -- it holds only its body. if_statement is left
# out of it: an `else if` is a bare if_statement there, and s-brace-else-if
# owns that case.
id: s-brace-body
language: cpp
severity: hint
utils:
  statement:
    any:
      - { kind: expression_statement }
      - { kind: declaration }
      - { kind: return_statement }
      - { kind: continue_statement }
      - { kind: break_statement }
      - { kind: goto_statement }
      - { kind: throw_statement }
      - { kind: if_statement }
      - { kind: while_statement }
      - { kind: do_statement }
      - { kind: for_range_loop }
      - { kind: for_statement }
      - { kind: switch_statement }
rule:
  matches: statement
  pattern: $BS
  any:
    - inside: { kind: if_statement, field: consequence }
    - inside: { kind: while_statement, field: body }
    - inside: { kind: for_statement, field: body }
    - inside: { kind: for_range_loop, field: body }
fix: "{ $BS }"
---
# The same for a braceless `else`. if_statement is excluded so an `else if`
# chain reaches s-brace-else-if instead.
id: s-brace-else-body
language: cpp
severity: hint
rule:
  pattern: $BE
  inside: { kind: else_clause }
  any:
    - { kind: expression_statement }
    - { kind: declaration }
    - { kind: return_statement }
    - { kind: continue_statement }
    - { kind: break_statement }
    - { kind: goto_statement }
    - { kind: throw_statement }
    - { kind: while_statement }
    - { kind: do_statement }
    - { kind: for_range_loop }
    - { kind: for_statement }
    - { kind: switch_statement }
fix: "{ $BE }"
---
# `std::as_const(x)` / `qAsConst(x)` -> `x`.
#
# Both exist only to pick a const overload and stop Qt containers detaching;
# there is nothing in Ruby for them to become. Unwrapping here keeps it valid
# C++, so the range-for around it still parses and s-foreach still matches.
id: s-as-const
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        stopBy: end
        regex: '^(std::as_const|as_const|qAsConst)$'
    - has:
        field: arguments
        kind: argument_list
        has: { pattern: $ACV }
fix: "$ACV"
---
# camelCase identifiers -> snake_case, on the TREE rather than the text.
#
# This is why it belongs here and not in a regex: only identifier and
# field_identifier nodes are touched, so camelCase inside a string literal
# (`"checkForPermission: ERROR"`) or a comment cannot be hit. The text pass
# this replaces had to shelve every comment first to avoid exactly that, and
# still missed any identifier not followed by one of `(`, `.`, `,`, `)` or a
# space -- which is how `originalPath` survived 8 times, including inside
# `#{originalPath}`.
#
# Still valid C++, so it stays a C++ -> C++ rule and everything downstream
# keeps parsing.
#
# Exclusions, all load-bearing:
#   qC[A-Z]  the logging functions, which transform.yml's s-log matches by name
#   lc[A-Z]  the logging CATEGORY, whose value is looked up from the
#            Q_LOGGING_CATEGORY declaration by that exact spelling
#   q[A-Z]   Qt's global functions -- qMax, qAsConst, qFuzzyCompare
# PascalCase and SCREAMING_SNAKE are excluded by the `^[a-z]` anchor: they are
# types, enum constants and macros, not variables.
id: s-snake-identifier
language: cpp
severity: hint
rule:
  any:
    - kind: identifier
    - kind: field_identifier
  pattern: $ID
  regex: '^[a-z][a-zA-Z0-9]*[A-Z]'
  not:
    any:
      - { regex: '^qC[A-Z]' }
      - { regex: '^lc[A-Z]' }
      - { regex: '^q[A-Z]' }
fix: "$SNAKE"
transform:
  SNAKE:
    convert: { source: $ID, toCase: snakeCase }
---
# A member, `_currentFolder` -> `_current_folder`.
#
# Separate from s-snake-identifier because `convert` splits on the leading
# underscore and drops it, giving `current_folder` -- and that underscore is
# the only thing marking the name as a member for the `@` prefix later. So the
# prefix is stripped, converted, and put back.
id: s-snake-member
language: cpp
severity: hint
rule:
  any:
    - kind: identifier
    - kind: field_identifier
  pattern: $MID
  regex: '^_[a-z][a-zA-Z0-9]*[A-Z]'
transform:
  MBARE:
    replace: { source: $MID, replace: '^_', by: '' }
  MSNAKE:
    convert: { source: $MBARE, toCase: snakeCase }
fix: "_$MSNAKE"
---
# A default-constructed Qt string type is an empty string.
#
# `QChar()`, `QString()`, `QByteArray()` all mean "empty" -- there is no Qt
# string type in Ruby, so they are plain `""`, the same reasoning that turns
# `QStringLiteral("x")` into `"x"` and `QLatin1Char('.')` into `"."` above.
#
# `""` is valid C++ too, so this stays a C++ -> C++ rule and the file keeps
# parsing for everything downstream. Caught here rather than in the Ruby,
# because by then the zero-argument parens have been stripped and `QChar()` is
# indistinguishable from a reference to a constant named QChar.
id: s-qt-empty-string
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^Q(String|Char|ByteArray|Latin1String|Latin1Char)$'
    - has:
        field: arguments
        kind: argument_list
        not: { has: { nthChild: 1 } }
fix: '""'
---
# A ternary ASSIGNMENT becomes an if/else.
#
# `Style/DisableSyntax` bans the ternary but does not autocorrect it -- it only
# reports -- so the expansion has to happen in the rules, and the golden spells
# it as an if/else chain:
#
#     if @query_local == :parent_not_changed
#       recurse_query_local = :parent_not_changed
#     elsif (...)
#       recurse_query_local = :normal_query
#     else
#       recurse_query_local = :parent_dont_exist
#     end
#
# Both forms are rewritten to a C++ `if`, so the file keeps parsing and the
# emitter's existing s-if-else handles it. A NESTED ternary needs no special
# case: the else branch comes out as another ternary assignment, which the
# simplify fixpoint expands on the next round, and Style/IfInsideElse then
# collapses `else { if ... }` to `elsif`.
#
# Only assignment position. A ternary used as an argument stays a ternary --
# the golden keeps `(is_directory ? ItemTypeDirectory : ItemTypeFile)` -- and
# there is nowhere to put the if.
#
# `stopBy: end` on the conditional_expression because the earlier ternary
# normalisation has already wrapped it in parens.
id: s-ternary-decl
language: cpp
severity: hint
rule:
  kind: declaration
  has:
    field: declarator
    kind: init_declarator
    all:
      - has: { field: declarator, stopBy: end, kind: identifier, pattern: $TN }
      # The conditional must BE the value, not merely live somewhere inside
      # it. `stopBy: end` here reached a ternary nested in an argument --
      # `traversal_pattern_match(path, (is_directory ? A : B))` -- and hoisted
      # it as though it were the assigned value, which silently replaced the
      # call with an if/else over the wrong variable. Same for a ternary deep
      # inside a lambda body.
      #
      # Two shapes, because the earlier ternary normalisation wraps it in one
      # layer of parens.
      - has:
          field: value
          any:
            - kind: conditional_expression
              all:
                - has: { field: condition, pattern: $TC }
                - has: { field: consequence, pattern: $TT }
                - has: { field: alternative, pattern: $TE }
            - kind: parenthesized_expression
              has:
                kind: conditional_expression
                all:
                  - has: { field: condition, pattern: $TC }
                  - has: { field: consequence, pattern: $TT }
                  - has: { field: alternative, pattern: $TE }
fix: |-
  if ($TC) { $TN = $TT; } else { $TN = $TE; }
---
# The same for a plain assignment, which is also what the nested case leaves
# behind for the next round of the fixpoint.
id: s-ternary-assign
language: cpp
severity: hint
rule:
  kind: expression_statement
  has:
    kind: assignment_expression
    all:
      - has: { field: left, pattern: $AN }
      - has:
          field: right
          any:
            - kind: conditional_expression
              all:
                - has: { field: condition, pattern: $AC }
                - has: { field: consequence, pattern: $AT }
                - has: { field: alternative, pattern: $AE }
            - kind: parenthesized_expression
              has:
                kind: conditional_expression
                all:
                  - has: { field: condition, pattern: $AC }
                  - has: { field: consequence, pattern: $AT }
                  - has: { field: alternative, pattern: $AE }
fix: |-
  if ($AC) { $AN = $AT; } else { $AN = $AE; }
---
# A pointer dereference loses its `*`: `needsMetadataUpdate(*item)` -> `(item)`.
#
# Ruby has no dereference, and `*item` there is a SPLAT -- it expands the
# receiver into an argument list, which is not what the C++ means and is a
# silent change of behaviour, not just noise. Four sites in discovery.cpp.
#
# `pointer_expression` with a `*` is exactly the dereference: multiplication is
# a binary_expression and a pointer TYPE is a pointer_declarator, so neither is
# reachable from here. Address-of shares this node kind, hence the regex.
id: s-deref
language: cpp
severity: hint
rule:
  kind: pointer_expression
  regex: '^\*'
  has: { field: argument, pattern: $DRV }
fix: "$DRV"
---
# A ternary in ARGUMENT position: the statement is emitted once per branch.
#
#     item->setInstruction(isConflict ? A : B);
#
# becomes
#
#     if (isConflict) { item->setInstruction(A); }
#     else            { item->setInstruction(B); }
#
# s-ternary-decl and s-ternary-assign only reach a ternary that IS the assigned
# value; there is nowhere to put an `if` when the ternary sits inside a call, so
# the whole statement is duplicated instead with the ternary replaced by each
# side.
#
# The duplication is done by rewriters rather than by text surgery: t-then and
# t-else each rewrite a conditional_expression to one of its branches, and the
# rest of the statement -- the call, the other arguments -- is preserved
# because neither rewriter matches it and no `joinBy` is used.
#
# `inside: { kind: argument_list, stopBy: end }` is what keeps this disjoint
# from the assignment rules, so the two can never contend for the same node.
id: s-ternary-arg
language: cpp
severity: hint
rule:
  # A declaration counts as well as a plain statement: `excluded = f(path,
  # cond ? A : B);` has the ternary in an argument, not as the assigned value,
  # so s-ternary-decl does not reach it.
  any:
    - kind: expression_statement
    - kind: declaration
  pattern: $STMT
  has:
    stopBy: end
    kind: conditional_expression
    inside: { kind: argument_list, stopBy: end }
    has: { field: condition, pattern: $TAC }
  # The statement must be the conditional's OWN -- not one that merely contains
  # it inside a nested lambda. `auto postProcessRename = [...](path) { ...
  # processFileFinalize(..., cond ? A : B, ...) ... };` is a declaration whose
  # subtree holds the ternary, and matching it duplicated the entire 130-line
  # lambda. The statement inside the lambda body matches instead.
  not:
    has:
      stopBy: end
      kind: lambda_expression
      has:
        stopBy: end
        kind: conditional_expression
        inside: { kind: argument_list, stopBy: end }
rewriters:
  - id: t-then
    rule:
      kind: conditional_expression
      has: { field: consequence, pattern: $TTT }
    fix: "$TTT"
  - id: t-else
    rule:
      kind: conditional_expression
      has: { field: alternative, pattern: $TEE }
    fix: "$TEE"
transform:
  THEN:
    rewrite: { rewriters: [t-then], source: $STMT }
  ELSE:
    rewrite: { rewriters: [t-else], source: $STMT }
fix: |-
  if ($TAC) { $THEN } else { $ELSE }

id: s-qt-arg-interp-1
language: cpp
severity: hint
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: field_expression
        all:
          - has:
              field: argument
              kind: string_literal
              has: { kind: string_content, pattern: $SC }
          - has: { field: field, regex: '^arg$' }
    - has:
        field: arguments
        kind: argument_list
        all:
          - has: { nthChild: 1, pattern: $A1, not: { kind: string_literal } }
          - not: { has: { nthChild: 2 } }
transform:
  PRE:
    replace: { source: $SC, replace: '%1[\s\S]*$', by: '' }
  POST:
    replace: { source: $SC, replace: '^[\s\S]*%1', by: '' }
fix: '"$PRE#{$A1}$POST"'

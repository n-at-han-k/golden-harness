# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Golden-harness pipeline.
#
# Layout:
#   02-input/<rel>/<name>.<ext>      source case
#   01-golden/<rel>/<name>.<ext>.rb  hand-written golden (gated)
#   03-output/<rel>/<name>.<ext>.rb  generated output artifact
#
# Commands:
#   task                                  verify all gated goldens
#   task verify SRC=02-input/.../foo.cpp  verify one case
#   task bootstrap SRC=02-input/.../foo.cpp  generate golden draft from input
#   task add SRC=../src/libsync/foo.cpp  copy file into 02-input

version: '3'

tasks:
  default:
    desc: Verify all gated goldens (no regressions)
    cmds:
      - python3 scripts/05_validate.py

  verify:
    desc: Verify one case against its golden
    requires:
      vars: [SRC]
    cmds:
      - python3 scripts/05_validate.py --case "{{.SRC}}"

  bootstrap:
    desc: Generate golden draft from input into 01-golden
    requires:
      vars: [SRC]
    cmds:
      - python3 scripts/05_validate.py --case "{{.SRC}}" --bootstrap

  add:
    desc: Copy a source file into 02-input
    requires:
      vars: [SRC]
    cmds:
      - python3 scripts/05_validate.py --add "{{.SRC}}"
